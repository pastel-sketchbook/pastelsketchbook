version: '3'

vars:
  DEFAULT_BRANCH: main
  ORIGIN: origin

env:
  DEFAULT_BRANCH: '{{.DEFAULT_BRANCH}}'
  ORIGIN: '{{.ORIGIN}}'

tasks:
  dev:
    desc: Start the homepage dev server
    dir: homepage
    cmds:
      - bun run dev

  build:
    desc: Generate wikis, sync zmd index, then build homepage (lossless pipeline)
    deps: [generate]
    cmds:
      - task: zmd:update
      - task: build:only

  build:only:
    desc: Build homepage only (skip wiki generation and zmd sync)
    dir: homepage
    cmds:
      - bun run build

  generate:
    desc: Run all generators (transcripts, details, topics, analysis-if-due)
    cmds:
      - task: wiki:transcripts
      - task: wiki:details
      - task: wiki:topics
      - task: wiki:analysis:if-due

  zmd:update:
    desc: Sync zmd index from wiki collection
    cmds:
      - zmd update

  wiki:analysis:
    desc: Generate semiannual channel analysis now
    dir: homepage
    cmds:
      - bun run wiki:analysis

  wiki:analysis:if-due:
    desc: Generate semiannual channel analysis only in Apr/Oct
    dir: homepage
    cmds:
      - bun run wiki:analysis:if-due

  deploy:
    desc: Deploy homepage to Vercel production
    dir: homepage
    cmds:
      - bun run deploy:vercel

  push:
    desc: Push current jj revision to origin (creates/moves bookmark as needed)
    cmds:
      - ./scripts/push.sh

  push:main:
    desc: Move main bookmark to current target and push
    cmds:
      - ./scripts/push-main.sh

  push:force:
    desc: Force push the bookmark on the current target to origin
    cmds:
      - ./scripts/push-force.sh

  branch:delete:
    desc: Safely delete a remote branch (archives tip locally to prevent orphaning)
    cmds:
      - ./scripts/branch-delete.sh {{.BRANCH}}

  tools:yt-transcript:
    desc: Build the yt-transcript CLI (Zig)
    dir: tools/yt-transcript
    cmds:
      - zig build -Doptimize=ReleaseFast
    sources:
      - src/**/*.zig
      - build.zig
    generates:
      - zig-out/bin/yt-transcript

  wiki:details:
    desc: Generate per-video wiki detail pages (transcript only, no API)
    dir: homepage
    deps: [tools:yt-transcript]
    cmds:
      - bun scripts/generate-video-details.ts {{.CLI_ARGS | default "--all"}}

  wiki:transcripts:
    desc: Export raw video transcripts into wiki/raw/transcripts
    dir: homepage
    deps: [tools:yt-transcript]
    cmds:
      - bun run wiki:transcripts {{.CLI_ARGS | default "--all"}}

  wiki:topics:
    desc: Generate topic pages + related-video links (from detail wikis)
    dir: homepage
    cmds:
      - bun scripts/generate-wiki.ts

  zmd:lookup:
    desc: "Search wiki context via zmd (example: task zmd:lookup -- 'LLM wiki')"
    cmds:
      - zmd context {{.CLI_ARGS}}

  status:
    desc: Show jj status and bookmark info
    cmds:
      - jj status
      - echo ""
      - echo "Bookmarks:"
      - jj bookmark list
